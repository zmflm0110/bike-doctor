# 올릴 때마다: 엔진·서버 단위 테스트 + 웹앱 휴대폰 화면 검사 + 진짜 오프라인 시연 검사 (원본 자료·인증키 불필요)
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tests/web/route.test.js && node tests/web/smoke.js
      - run: |
          for m in normal evict notiles; do PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS=1 node tests/web/offline.js $m; done
